kind = "mobile"
previewPath = "/"
title = "LinguaMatch"
description = "A fun, kid-friendly mobile app for learning vocabulary in multiple languages through matching games. Players match words in English with their translations, organized into chapters, levels, and themed categories. Designed to feel playful and encouraging for all ages."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
